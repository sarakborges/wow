[package]
name = "wow-mpq-inspector"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
description = "Read-only catalog generator for World of Warcraft MPQ installations"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wow-mpq = "0.7.0"
